# pnpm 设置（pnpm v10+ 不再读取 package.json 中的 pnpm 字段）
# https://pnpm.io/settings
# pnpm 10+ build-script allowlist. These packages need install/build scripts
# for Electron's native tooling and platform-specific packaging helpers.
allowBuilds:
  '@parcel/watcher': true
  electron: true
  electron-winstaller: true
  esbuild: true

# 维护约定：每次升级依赖后重新执行 pnpm audit，逐条核对下面的 override：
# 上游已自带修复版本的条目直接删除，不要让 pin 越积越多、反过来阻碍升级
overrides:
  # 与 electron-vite 6 验证过的版本对齐；升级 vite 时同步修改这里
  vite: 8.3.4
  '@types/node': 24.19.2
  # ---- 安全修复（pnpm audit，均为构建链传递依赖）----
  # 注意：范围必须带上界；brace-expansion 不可跨大版本升到 v5，
  # v5 的 CJS 导出是 { expand } 命名导出，而 minimatch<10 直接把
  # require('brace-expansion') 当函数调用，强升会在打包时运行时报错
  'tar@7': '>=7.5.21 <8'
  'brace-expansion@1': '>=1.1.21 <2'
  'brace-expansion@2': '>=2.1.7 <3'
  'brace-expansion@5': '>=5.0.12 <6'
  'js-yaml@4': '>=4.3.2 <5'
  'immutable@5': '>=5.1.8 <6'
  'fast-uri@3': '>=3.1.8 <4'
  'postcss@8': '>=8.5.30 <9'
  'nanoid@3': '>=3.3.18 <4'
  'browserslist@4': '>=4.28.7 <5'
  '@xmldom/xmldom@0.8': '>=0.8.15 <0.9'
  'baseline-browser-mapping@2': '>=2.11.0 <3'
  'source-map-js@1': '>=1.2.2 <2'
  'http-cache-semantics@4': '>=4.3.0 <5'
  'postcss-selector-parser@7': '>=7.1.6 <8'
  # vite 8 的 esbuild peer 明确允许 ^0.28；0.27 线有 dev server 文件读取漏洞且无修复版本
  esbuild: '>=0.28.1 <0.29'

auditConfig:
  ignoreGhsas:
    # sprintf-js ReDoS：上游停止维护、无修复版本；仅出现在 electron-builder
    # 构建期下载链（@electron/get > global-agent > roarr），不进应用运行时
    - GHSA-hp3w-g68c-fv3c

# 临时豁免：electron-vite 6.0.0 发布未满 minimumReleaseAge 冷却期时需要放行；
# 过了冷却期（或升级到新版本）后删除整个字段
minimumReleaseAgeExclude:
  - electron-vite@6.0.0
